<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>LUCY RPS 취향표</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#111827;--sub:#6b7280;--ic:#9ca3af;--ln:#e5e7eb;--bl:#3b82f6;--blsoft:#dbeafe;--sh:0 2px 12px rgba(0,0,0,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--sub:#9ca3af;--ic:#6b7280;--ln:#2d323c;--blsoft:#1e3a6e;--sh:0 2px 12px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--tx:#f3f4f6;--sub:#9ca3af;--ic:#6b7280;--ln:#2d323c;--blsoft:#1e3a6e;--sh:0 2px 12px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:440px;margin:0 auto;padding:0 0 28px}
#chart{background:var(--bg);padding:14px 14px 4px}
h1{margin:2px 4px 12px;font-size:19px;font-weight:800;letter-spacing:-.03em}
h1 span{color:var(--bl)}
.card{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 14px 10px;margin-bottom:12px}
.x{position:absolute;top:6px;right:6px}
button{border:0;background:none;padding:6px;cursor:pointer;color:var(--ic);display:inline-flex;align-items:center}
.top{display:flex;gap:12px;align-items:center;padding-right:34px}
.av{width:50px;height:50px;flex:none;border-radius:50%;overflow:hidden;background:var(--blsoft);color:var(--bl);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0;flex:1}
.nm{display:flex;align-items:center;gap:2px}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;padding:0;margin:0}
.name{font-size:16px;font-weight:700;width:4em;min-width:2.5em;max-width:100%}
.pc{color:var(--sub);font-size:14px;margin-top:3px;white-space:nowrap;display:flex;align-items:center}
.pc span{line-height:20px}
.pc .lb{margin-right:5px}
.pc .sep{margin:0 7px}
.pc input{width:1.6ch;text-align:right;padding:0 1px;height:20px;line-height:20px;font-size:14px;border-bottom:1.5px solid var(--ln);color:var(--tx);font-weight:600}
.pc input:focus{border-color:var(--bl)}
.barrow{display:flex;align-items:center;gap:10px;margin:10px 0 8px;color:var(--sub);font-size:13px}
.track{position:relative;flex:1;height:10px;border-radius:6px;background:var(--ln)}
.fill{position:absolute;top:0;bottom:0;background:var(--bl);border-radius:2px}
.mid{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--tx);border-radius:1px;opacity:.55}
.cm{display:flex;align-items:flex-start;gap:6px}
textarea{flex:1;resize:none;overflow:hidden;font-size:14px;line-height:1.45;padding:4px 0}
textarea::placeholder{color:var(--ic)}
.cm button{margin-top:1px}
.acts{display:flex;gap:10px;padding:0 16px}
.acts button{flex:1;justify-content:center;padding:14px;border-radius:14px;font-size:16px;font-weight:600}
.add{background:var(--card);color:var(--bl);box-shadow:var(--sh)}
.save{background:var(--bl);color:#fff}
.cap .ui{display:none!important}
.cap #chart{padding:34px 18px 30px}
[hidden]{display:none!important}
.cap .cm.empty{display:none}
.cap .card{box-shadow:0 0 0 1px var(--ln)}
.cap .pc input{border-bottom-color:transparent}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;z-index:9}
#ov img{max-width:100%;max-height:76%;border-radius:10px}
#ov p{color:#fff;margin:0;font-size:15px}
#ov button{color:#fff;background:#ffffff33;border-radius:10px;padding:10px 22px}
#msg{text-align:center;color:var(--sub);font-size:14px;min-height:20px;margin-top:10px}

#v-rps{max-width:600px;margin:0 auto;padding:6px 14px 40px;--hd:#f6f8fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #v-rps{--hd:#20242d}}
:root[data-theme="dark"] #v-rps{--hd:#20242d}
#v-rps button{justify-content:center}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(210px,calc(100% - 28px));margin:14px auto 6px;padding:3px;border-radius:999px;background:var(--card);border:1.5px solid var(--blsoft);box-shadow:var(--sh)}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--bl);box-shadow:0 3px 10px rgba(59,130,246,.35);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.seg[data-v="lr"] i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:8px 0;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:-.02em;font-family:inherit;color:var(--sub);transition:color .2s}
.seg button.on{color:#fff}
#v-rps h1{font-size:22px;font-weight:800;text-align:center;color:var(--tx);margin:0 0 14px;letter-spacing:-.3px}
#v-rps h1 b{color:var(--bl)}
#v-rps .rcard{background:var(--card);border-radius:26px;padding:16px 14px 18px}
#v-rps .tw{border:1px solid var(--ln);border-radius:14px;overflow:hidden}
#v-rps table{width:calc(100% + 2px);margin:-1px;border-collapse:collapse;table-layout:fixed}
#v-rps th,#v-rps td{border:1px solid var(--ln);height:48px;text-align:center;font-size:15px;font-weight:600;padding:0;color:var(--tx)}
#v-rps th{background:var(--hd);font-size:13px;font-weight:700}
#v-rps th:first-child{width:17%}
#v-rps td{cursor:pointer;background:var(--card)}
#v-rps td.dg{cursor:default}
#v-rps .legend{display:flex;flex-wrap:nowrap;justify-content:center;gap:8px;margin:14px 0 16px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--tx)}
#v-rps .legend span{display:flex;align-items:center;gap:4px}
#v-rps .dot{width:12px;height:12px;border-radius:50%;border:1px solid #dde2ec;display:inline-block;flex:none}
#v-rps .btns{display:flex;justify-content:center;gap:8px}
#v-rps .btns button{padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;border:1.5px solid var(--bl)}
#v-rps #rsave{background:var(--bl);color:#fff}
#v-rps #rreset{background:var(--card);color:var(--bl)}
#v-rps .ov{position:fixed;inset:0;background:rgba(21,27,43,.4);display:none;justify-content:center;z-index:10}
#v-rps .ov.on{display:flex}
#v-rps .panel{background:var(--card);width:100%;max-width:600px;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
#v-rps .sheet{align-items:flex-end}
#v-rps .sheet .panel{border-radius:24px 24px 0 0}
#v-rps .ctr{align-items:center;padding:0 14px}
#v-rps .ctr .panel{border-radius:22px;padding:18px;max-height:92vh;overflow:auto}
#v-rps .panel h2{margin:0 0 14px;text-align:center;font-size:18px;color:var(--tx)}
#v-rps .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#v-rps .opts button{display:flex;align-items:center;gap:8px;justify-content:center;padding:13px 6px;border:2px solid var(--ln);border-radius:12px;background:var(--card);font-size:15px;font-weight:600;font-family:inherit;color:var(--tx)}
#v-rps .opts .dot{width:18px;height:18px}
#v-rps .opts button.on{border-color:var(--bl)}
#v-rps .pbtns{display:flex;gap:10px;margin-top:14px}
#v-rps .pbtns button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--bl);background:var(--card);color:var(--bl);font-weight:700;font-size:15px;font-family:inherit}
#v-rps .pbtns button.main{background:var(--bl);color:#fff}
#v-rps #pv{display:block;width:100%;height:auto;border:1px solid var(--ln);border-radius:8px}
#v-rps .hint{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 0}
</style>
</head>
<body>
<nav class="seg" id="seg" data-v="rps" role="tablist" aria-label="취향표 선택"><i></i><button type="button" role="tab" data-v="rps">RPS 취향표</button><button type="button" role="tab" data-v="lr">왼른 취향표</button></nav>
<section id="v-rps">
<h1 id="title"></h1>
<div class="rcard" id="card">
  <div class="tw"><table id="grid"></table></div>
  <div class="legend" id="legend"></div>
  <div class="btns"><button id="rsave">이미지 저장</button><button id="rreset">초기화</button></div>
</div>

<!-- 색 선택 -->
<div class="ov sheet" id="rov"><div class="panel">
  <h2 id="sh"></h2>
  <div class="opts" id="opts"></div>
  <div class="pbtns"><button id="clr">지우기</button><button id="cls">닫기</button></div>
</div></div>

<!-- 이미지 미리보기 -->
<div class="ov ctr" id="rov2"><div class="panel">
  <img id="pv" alt="취향표 이미지">
  <p class="hint">이미지를 길게 눌러 저장하거나, 아래 버튼을 눌러 주세요</p>
  <div class="pbtns"><button class="main" id="dl">저장 / 공유</button><button id="cls2">닫기</button></div>
</div></div>

<!-- 초기화 확인 -->
<div class="ov ctr" id="rov3"><div class="panel">
  <h2>모두 지울까요?</h2>
  <div class="pbtns"><button id="no">취소</button><button class="main" id="yes">지우기</button></div>
</div></div>

</section>
<section id="v-lr" hidden>
<main>
<div id="chart"><h1><span>LUCY</span> 왼른 취향표</h1><div id="list"></div></div>
<div class="acts"><button class="add" id="add">+ 카드 추가</button><button class="save" id="save">이미지로 저장</button></div>
<div class="acts" style="margin-top:10px"><button class="add" id="undo" hidden>↩ 삭제 되돌리기</button><button class="add" id="restore">기본 멤버 복구</button></div>
<div id="msg"></div>
</main>
<div id="ov"><img id="oi" alt="취향표"><p>이미지를 길게 눌러 저장하세요</p><button id="oc">닫기</button></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(()=>{
const KEY = 'lucy-chart-v1';
const PEN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const XI = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
const uid = () => Math.random().toString(36).slice(2);
const AVSVG = '<svg viewBox="0 0 50 50" width="100%" height="100%"><rect width="50" height="50" fill="#cfd5de"/><circle cx="25" cy="20" r="8.5" fill="#fff"/><path d="M8 52c0-11 7.5-17 17-17s17 6 17 17z" fill="#fff"/></svg>';
const mk = n => ({ id: uid(), name: n || '새 멤버', img: '', l: 50, r: 50, c: '' });
const clamp = v => { v = parseInt(v, 10); return isNaN(v) ? 0 : Math.max(0, Math.min(100, v)); };
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !Array.isArray(S.cards)) S = { cards: ['신예찬', '최상엽', '조원상', '신광일'].map(mk) };
let t = 0;
function persist() {
  clearTimeout(t);
  t = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 300);
}
function shrink(file, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(im.width, im.height), c = document.createElement('canvas');
      c.width = c.height = 240;
      c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 240, 240);
      cb(c.toDataURL('image/jpeg', 0.88));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function setAv(av, c) {
  av.innerHTML = '';
  if (c.img) { const i = document.createElement('img'); i.src = c.img; i.alt = ''; av.appendChild(i); }
  else av.innerHTML = AVSVG;
}
function bar(el, c) {
  const f = el.querySelector('.fill');
  f.style.left = (50 - c.l / 2) + '%';
  f.style.width = ((c.l + c.r) / 2) + '%';
}
function sizeTa(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function build(c) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<button class="x ui" aria-label="삭제">' + XI + '</button>' +
    '<div class="top"><div class="av"></div><input type="file" accept="image/*" hidden>' +
    '<div class="info"><div class="nm"><input class="name" maxlength="14" aria-label="이름"><button class="pen ui" aria-label="이름 수정">' + PEN.replace(/18/g, '14') + '</button></div>' +
    '<div class="pc"><span class="lb">왼</span><input class="pl" inputmode="numeric" aria-label="왼쪽 퍼센트"><span>%</span><span class="sep">|</span><span class="lb">른</span><input class="pr" inputmode="numeric" aria-label="오른쪽 퍼센트"><span>%</span></div></div></div>' +
    '<div class="barrow"><span>왼</span><div class="track"><i class="fill"></i><i class="mid"></i></div><span>른</span></div>' +
    '<div class="cm"><textarea rows="1" placeholder="comment" maxlength="200"></textarea><button class="pen ui" aria-label="코멘트 수정">' + PEN + '</button></div>';
  const q = s => el.querySelector(s);
  const av = q('.av'), file = q('input[type=file]'), nm = q('.name'), pl = q('.pl'), pr = q('.pr'), ta = q('textarea'), cm = q('.cm');
  nm.value = c.name; pl.value = c.l; pr.value = c.r; ta.value = c.c;
  const fit = () => { nm.style.width = Math.max(2.5, nm.value.length * 1.05 + 0.6) + 'em'; }; fit();
  setAv(av, c); bar(el, c); cm.classList.toggle('empty', !c.c);
  av.onclick = () => file.click();
  file.onchange = () => { if (file.files[0]) shrink(file.files[0], d => { c.img = d; setAv(av, c); persist(); }); };
  nm.oninput = () => { c.name = nm.value; fit(); if (!c.img) setAv(av, c); persist(); };
  q('.nm .pen').onclick = () => { nm.focus(); nm.select(); };
  const pct = (inp, k) => {
    inp.oninput = () => { const v = clamp(inp.value); c[k] = v; if (inp.value !== '' && String(v) !== inp.value) inp.value = v; fp(inp); bar(el, c); persist(); };
    inp.onblur = () => { inp.value = c[k]; fp(inp); };
    inp.onfocus = () => inp.select();
  };
  const fp = i => { i.style.width = (Math.max(1, String(i.value).length) + 0.5) + 'ch'; };
  pct(pl, 'l'); pct(pr, 'r'); fp(pl); fp(pr);
  ta.oninput = () => { c.c = ta.value; cm.classList.toggle('empty', !c.c); sizeTa(ta); persist(); };
  q('.cm .pen').onclick = () => ta.focus();
  q('.x').onclick = () => { trash.push({ c, i: S.cards.indexOf(c) }); S.cards = S.cards.filter(x => x.id !== c.id); el.remove(); persist(); document.getElementById('undo').hidden = false; };
  return el;
}
function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  S.cards.forEach(c => list.appendChild(build(c)));
  list.querySelectorAll('textarea').forEach(sizeTa);
}
document.getElementById('add').onclick = () => {
  const c = mk(); S.cards.push(c);
  const el = build(c); document.getElementById('list').appendChild(el);
  persist(); el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const n = el.querySelector('.name'); n.focus(); n.select();
};
const msg = s => { document.getElementById('msg').textContent = s; };
document.getElementById('oc').onclick = () => { document.getElementById('ov').style.display = 'none'; };
document.getElementById('save').onclick = async () => {
  const chart = document.getElementById('chart');
  if (typeof html2canvas !== 'function') { msg('이미지 도구를 불러오지 못했어요. 새로고침해 주세요.'); return; }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  msg('이미지 만드는 중...');
  document.body.classList.add('cap');
  let cv;
  try {
    const rc = chart.getBoundingClientRect();
    const sc = Math.max(2, Math.min(4, Math.sqrt(12e6 / (rc.width * rc.height))));
    const tas = [...document.querySelectorAll('textarea')];
    cv = await html2canvas(chart, { scale: sc, onclone: d => { d.querySelectorAll('textarea').forEach((t, i) => { const x = d.createElement('div'); x.textContent = tas[i] ? tas[i].value : t.value; x.style.cssText = 'flex:1;min-width:0;font-size:14px;line-height:1.45;padding:4px 0;white-space:pre-wrap;overflow-wrap:anywhere'; t.replaceWith(x); }); }, backgroundColor: getComputedStyle(chart).backgroundColor });
  } catch (e) { msg('이미지 생성에 실패했어요.'); return; }
  finally { document.body.classList.remove('cap'); }
  let dl = null;
  try { dl = window.claude && claude.use ? await claude.use('downloads') : null; } catch (e) {}
  if (dl) {
    try {
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      await dl.save({ filename: 'LUCY-취향표.png', data: blob });
      msg('저장 완료!');
    } catch (e) { msg(e && e.code === 'declined' ? '' : '저장하지 못했어요.'); }
  } else {
    document.getElementById('oi').src = cv.toDataURL('image/png');
    document.getElementById('ov').style.display = 'flex';
    msg('');
  }
};
document.addEventListener('pointerdown', e => {
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && !e.target.closest('input,textarea,button')) a.blur();
});
let trash = [];
document.getElementById('undo').onclick = () => {
  const d = trash.pop(); if (!d) return;
  S.cards.splice(Math.min(d.i, S.cards.length), 0, d.c);
  render(); persist();
  if (!trash.length) document.getElementById('undo').hidden = true;
};
document.getElementById('restore').onclick = () => {
  const have = S.cards.map(c => c.name);
  const miss = ['신예찬', '최상엽', '조원상', '신광일'].filter(n => !have.includes(n));
  if (!miss.length) { msg('기본 멤버 4명이 모두 있어요.'); return; }
  miss.forEach(n => S.cards.push(mk(n)));
  render(); persist(); msg(miss.join(', ') + ' 카드를 복구했어요.');
};
render();

})();
</script>
<script>
(()=>{
const TITLE="LUCY RPS 취향표";
const M=["신예찬","최상엽","조원상","신광일"];
const T=[["","녜엽","녜조","녜빛"],["엽녜","","엽조","엽빛"],["원녜","조엽","","조빛"],["빛녜","빛엽","빛조",""]];
const C=[["OTP","#f8c8c8","#151b2b"],["좋음","#fbe0c3","#151b2b"],["호감","#fdfbc8","#151b2b"],["관심없음","#ffffff","#a3abbd"],["별로","#d5f7ea","#151b2b"],["지뢰","#8f95a3","#ffffff"]];
const fresh=()=>M.map(()=>M.map(()=>-1));
let g=fresh(),cur=null,png="";
const $=id=>document.getElementById(id);
const show=id=>$(id).classList.add("on"),hide=id=>$(id).classList.remove("on");
const [BRAND,...REST]=TITLE.split(" ");

function render(){
  $("title").innerHTML=`<b>${BRAND}</b> ${REST.join(" ")}`;
  let h="<tr><th></th>"+M.map(m=>`<th>${m}</th>`).join("")+"</tr>";
  M.forEach((m,i)=>{
    h+=`<tr><th>${m}</th>`;
    M.forEach((_,j)=>{
      if(i===j){h+='<td class="dg"></td>';return}
      const v=g[i][j],s=v<0?"":`style="background:${C[v][1]};color:${C[v][2]}"`;
      h+=`<td ${s} data-r="${i}" data-c="${j}">${T[i][j]}</td>`;
    });
    h+="</tr>";
  });
  $("grid").innerHTML=h;
}
$("legend").innerHTML=C.map(c=>`<span><i class="dot" style="background:${c[1]}"></i>${c[0]}</span>`).join("");

/* 색 선택 */
function openSheet(r,c){
  cur=[r,c];
  $("sh").textContent=T[r][c];
  $("opts").innerHTML=C.map((c2,k)=>`<button data-k="${k}" class="${g[r][c]===k?"on":""}"><i class="dot" style="background:${c2[1]}"></i>${c2[0]}</button>`).join("");
  show("rov");
}
function closeSheet(){hide("rov");cur=null}
$("grid").onclick=e=>{const t=e.target.closest("td");if(t&&t.dataset.r!==undefined)openSheet(+t.dataset.r,+t.dataset.c)};
$("opts").onclick=e=>{const b=e.target.closest("button");if(!b||!cur)return;g[cur[0]][cur[1]]=+b.dataset.k;render();closeSheet()};
$("clr").onclick=()=>{if(cur){g[cur[0]][cur[1]]=-1;render()}closeSheet()};
$("cls").onclick=closeSheet;
["rov","rov2","rov3"].forEach(id=>{$(id).onclick=e=>{if(e.target===$(id))hide(id)}});

/* 초기화 */
$("rreset").onclick=()=>show("rov3");
$("no").onclick=()=>hide("rov3");
$("yes").onclick=()=>{g=fresh();render();hide("rov3")};

/* 이미지 저장 */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function draw(){
  const R=e=>e.getBoundingClientRect(),F="-apple-system,'Noto Sans KR',sans-serif";
  const cr=R($("card")),hr=R($("title")),lr=R($("legend")),tr=R($("grid").parentElement);
  const padX=14,padT=22,padB=24,cardB=lr.bottom+16;
  const L0=cr.left-padX,T0=hr.top-padT,W=1500,s=W/(cr.width+padX*2);
  const H=Math.round((cardB+padB-T0)*s);
  const X=v=>(v-L0)*s,Y=v=>(v-T0)*s,lw=Math.max(2,s*.8);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const x=cv.getContext("2d");
  x.fillStyle="#f4f6fb";x.fillRect(0,0,W,H);
  /* 제목: LUCY만 파란색 */
  x.font=`800 ${22*s}px ${F}`;x.textBaseline="middle";x.textAlign="left";
  const rest=" "+REST.join(" "),w1=x.measureText(BRAND).width,w2=x.measureText(rest).width,sx=(W-w1-w2)/2,ty=Y(hr.top+hr.height/2);
  x.fillStyle="#3b82f6";x.fillText(BRAND,sx,ty);
  x.fillStyle="#151b2b";x.fillText(rest,sx+w1,ty);
  /* 흰 카드 */
  rr(x,X(cr.left),Y(cr.top),cr.width*s,(cardB-cr.top)*s,26*s);x.fillStyle="#fff";x.fill();
  /* 표: 화면의 실제 칸 크기를 그대로 사용 */
  x.save();rr(x,X(tr.left),Y(tr.top),tr.width*s,tr.height*s,14*s);x.clip();
  x.textAlign="center";x.strokeStyle="#e8ecf4";x.lineWidth=lw;
  [...$("grid").rows].forEach(row=>[...row.cells].forEach(cell=>{
    const q=R(cell),isH=cell.tagName==="TH";let bg=isH?"#f6f8fc":"#fff",col="#151b2b";
    if(!isH&&cell.dataset.r!==undefined){const v=g[+cell.dataset.r][+cell.dataset.c];if(v>=0){bg=C[v][1];col=C[v][2]}}
    const px=X(q.left),py=Y(q.top),pw=q.width*s,ph=q.height*s;
    x.fillStyle=bg;x.fillRect(px,py,pw,ph);x.strokeRect(px,py,pw,ph);
    if(cell.textContent){x.fillStyle=col;x.font=`${isH?700:600} ${(isH?13:15)*s}px ${F}`;x.fillText(cell.textContent,px+pw/2,py+ph/2+s*.5)}
  }));
  x.restore();
  rr(x,X(tr.left),Y(tr.top),tr.width*s,tr.height*s,14*s);x.strokeStyle="#e8ecf4";x.lineWidth=lw;x.stroke();
  /* 범례 */
  x.textAlign="left";x.font=`600 ${11*s}px ${F}`;
  [...$("legend").children].forEach((sp,k)=>{
    const d=R(sp.firstElementChild),sr=R(sp);
    x.beginPath();x.arc(X(d.left+d.width/2),Y(d.top+d.height/2),d.width/2*s-lw/2,0,7);x.fillStyle=C[k][1];x.fill();x.strokeStyle="#dde2ec";x.lineWidth=lw;x.stroke();
    x.fillStyle="#151b2b";x.fillText(C[k][0],X(d.right+4),Y(sr.top+sr.height/2)+s*.5);
  });
  return cv.toDataURL("image/png");
}
$("rsave").onclick=()=>{png=draw();$("pv").src=png;show("rov2")};
$("cls2").onclick=()=>hide("rov2");
$("dl").onclick=async()=>{
  try{
    const bin=atob(png.split(",")[1]),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const f=new File([u],"rps-chart.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=png;a.download="rps-chart.png";
  document.body.appendChild(a);a.click();a.remove();
};
render();

})();
</script>
<script>
(()=>{
const seg=document.getElementById('seg'),tabs=[...seg.querySelectorAll('button')];
const V={rps:document.getElementById('v-rps'),lr:document.getElementById('v-lr')};
const H={rps:'#rps',lr:'#left-right'},TT={rps:'LUCY RPS 취향표',lr:'LUCY 왼른 취향표'};
const cur=()=>location.hash==='#left-right'?'lr':'rps';
function go(v,push){
  Object.keys(V).forEach(k=>{V[k].hidden=k!==v});
  tabs.forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  seg.dataset.v=v;document.title=TT[v];
  if(push){try{history.pushState(null,'',H[v])}catch(e){try{location.hash=H[v]}catch(e2){}}window.scrollTo(0,0)}
}
tabs.forEach(b=>{b.onclick=()=>{if(b.dataset.v!==cur())go(b.dataset.v,true)}});
window.addEventListener('popstate',()=>go(cur(),false));
window.addEventListener('hashchange',()=>go(cur(),false));
go(cur(),false);
})();
</script>
</body>
</html>
